name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          for i in 1 2 3 4; do g++ -O2 -std=c++17 -Wall -Werror -o cau$i CAU$i.cpp; done

      - name: Test examples from the exam
        run: |
          check() {
            printf "$2" > CAU$1.INP
            ./cau$1
            got=$(tr -d '[:space:]' < CAU$1.OUT)
            [ "$got" = "$3" ] || { echo "FAIL CAU$1: got '$got', want '$3'"; exit 1; }
            echo "ok CAU$1 -> $got"
          }
          check 1 "1 2 3 4 5 6 7 8\n" ascending
          check 1 "8 7 6 5 4 3 2 1\n" descending
          check 1 "5 8 4 3 1 6 7 2\n" mixed
          check 2 "1 10 2\n" 1
          check 2 "19 88 8\n" 3
          check 3 "3\naba\n" 1
          check 3 "3\nabc\n" 0
          check 3 "10\nabcabckabc\n" 3
          check 3 "19\nchuchucikciklolipop\n" 4
          check 4 "35 1 2\n1 15 1\n2 20 1\n" 2
          check 4 "125 10 3\n19 35 5\n28 90 4\n88 70 3\n" 107
